name: Release

# Build SkyPhreak installers for Windows, macOS and Linux and publish them to the
# GitHub Release for the pushed tag. Trigger by pushing a version tag, e.g.:
#   git tag v0.3.0 && git push origin v0.3.0
# Manual runs (workflow_dispatch) build the artifacts without publishing.
#
# Do NOT create the GitHub Release by hand before pushing the tag. electron-builder
# refuses to upload into an existing release whose type differs from the type it is
# publishing, and it logs that as a skip rather than an error -- so the build goes
# green and the release ends up with zero assets. That is what happened to v0.4.0
# and, on its first attempt, v0.5.0-rc.3:
#
#   GitHub release not created  reason=existing type not compatible with publishing
#   type  existingType=pre-release  publishingType=draft
#
# package.json now pins publish.releaseType to "release", so electron-builder
# creates and publishes the release itself; the step below then flips candidate tags
# to pre-release afterwards. Always confirm assets landed:
#   gh release view <tag> --json assets
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
          - os: ubuntu-latest
            platform: Linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # The Node that runs npm/vite/electron-builder -- NOT the actions'
          # own runtime, which is what the Node 20 deprecation notices were
          # about. Keep `cache: npm` explicit: setup-node v5+ also caches
          # automatically off a `packageManager` field, which this repo omits.
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish (${{ matrix.platform }})
        env:
          # electron-builder publishes to the GitHub Release matching the tag.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple/Windows signing certs in CI — build unsigned rather than fail.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npm run dist -- --publish always
          else
            npm run dist -- --publish never
          fi

      # One runner only, so the three jobs cannot race on the same release.
      - name: Mark candidate tags as pre-release
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            *-rc*|*-alpha*|*-beta*)
              echo "Marking ${GITHUB_REF_NAME} as a pre-release."
              gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --prerelease
              ;;
            *)
              echo "${GITHUB_REF_NAME} is a final release; leaving the pre-release flag clear."
              ;;
          esac
